<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trailmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16211B;
    --paper:#F1F1EA;
    --paper-2:#E7E6DB;
    --moss:#45614B;
    --moss-soft:#DDE5D9;
    --trail:#C1440E;
    --trail-soft:#F3DCCF;
    --signal:#2F6F71;
    --signal-soft:#DCEBEA;
    --line:#CFCDBC;
    --muted:#6E6C60;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:720px;margin:0 auto;padding:32px 20px 80px;}
  h1,h2{font-family:'Fraunces',serif;margin:0;}
  .brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:8px;}
  .brand-name{font-size:26px;font-weight:600;letter-spacing:-0.01em;}
  .brand-tag{font-size:12px;color:var(--muted);letter-spacing:0.04em;text-transform:uppercase;}
  .whoami{font-size:13px;color:var(--moss);margin-top:6px;font-weight:600;}
  .contour{position:relative;height:1px;background:var(--line);margin:20px 0 28px;overflow:visible;}
  .contour svg{position:absolute;top:-9px;left:0;width:100%;height:18px;}

  .card{background:#FBFAF6;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
  .muted{color:var(--muted);font-size:13px;}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.03em;}
  input,select{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;
    background:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:16px;color:var(--ink);
  }
  input:focus,select:focus{outline:none;border-color:var(--moss);}
  input:disabled{background:var(--paper-2);color:var(--muted);cursor:not-allowed;}
  .admin-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--trail-soft);color:var(--trail);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;}
  .admin-box button{border-color:var(--trail);color:var(--trail);background:transparent;}
  .lock{color:var(--muted);font-size:12px;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  button{
    font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:14px;
    border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    padding:10px 16px;cursor:pointer;
  }
  button.secondary{background:transparent;color:var(--ink);border-color:var(--line);}
  button.small{padding:6px 10px;font-size:12px;}
  button:active{transform:scale(0.98);}
  .pillrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
  .pill{
    background:var(--moss-soft);color:var(--moss);font-size:13px;font-weight:500;
    padding:6px 12px;border-radius:100px;display:flex;align-items:center;gap:6px;
  }
  .pill button{background:none;border:none;color:var(--moss);padding:0;font-size:13px;line-height:1;cursor:pointer;}

  .steps{display:flex;gap:0;margin-bottom:24px;}
  .step{flex:1;text-align:center;position:relative;padding-bottom:14px;cursor:pointer;}
  .step .num{
    width:26px;height:26px;border-radius:50%;background:var(--paper-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:12px;font-family:'IBM Plex Mono',monospace;
  }
  .step.active .num{background:var(--trail);border-color:var(--trail);color:#fff;}
  .step .label{font-size:12px;color:var(--muted);}
  .step.active .label{color:var(--ink);font-weight:500;}
  .step::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--line);}
  .step.active::after{background:var(--trail);}

  .expense-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .expense-row:last-child{border-bottom:none;}
  .expense-desc{font-weight:500;font-size:14px;}
  .expense-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .expense-amt{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;}

  .settle-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .settle-item:last-child{border-bottom:none;}
  .who{font-size:14px;font-weight:500;flex:1;}
  .who .to{color:var(--trail);}
  .settle-amt{font-family:'IBM Plex Mono',monospace;font-size:15px;min-width:80px;text-align:right;}
  .path{flex:1;height:1px;background:repeating-linear-gradient(to right, var(--line) 0 4px, transparent 4px 8px);position:relative;margin:0 4px;}

  .empty{text-align:center;padding:32px 16px;color:var(--muted);font-size:14px;}
  .empty i{font-size:13px;}

  .code-box{display:flex;align-items:center;gap:10px;background:var(--signal-soft);color:var(--signal);padding:10px 14px;border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;margin-bottom:20px;}
  .code-box b{font-size:15px;letter-spacing:0.05em;}
  .settled-badge{background:var(--signal-soft);color:var(--signal);font-size:12px;padding:4px 10px;border-radius:100px;font-weight:500;}

  .hero{text-align:center;padding:60px 20px;}
  .hero h1{font-size:30px;margin-bottom:10px;}
  .hero p{color:var(--muted);font-size:14px;margin-bottom:28px;line-height:1.6;}
  .hero .card{text-align:left;max-width:360px;margin:0 auto 14px;}
  #toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-20px);
    background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;
    font-size:13px;max-width:90%;text-align:center;z-index:100;
    opacity:0;pointer-events:none;transition:opacity 0.2s ease, transform 0.2s ease;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .claim-row{display:flex;gap:6px;align-items:center;flex:1;}
  .claim-row input{flex:0 0 90px;text-align:center;letter-spacing:3px;}
  .inapp-warn{background:var(--trail-soft);color:var(--trail);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;line-height:1.5;}
</style>
</head>
<body>
<div id="toast"></div>
<div class="app" id="app"></div>

<script>
const SUPABASE_URL = 'https://xmrdrnqavluqkyygqhdc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtcmRybnFhdmx1cWt5eWdxaGRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTc1MTYsImV4cCI6MjEwMTg3MzUxNn0.eJAXu0O78xrfXj0q5OSjao9dAdEgeUwOh2qbeu9xX74';

const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function genCode(){
  let c='';
  for(let i=0;i<5;i++) c += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
  return c;
}
function genToken(){
  let t='';
  for(let i=0;i<12;i++) t += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
  return t;
}
function fmt(n){ return Math.round(n*100)/100; }
function money(n){ return '₹' + fmt(n).toLocaleString('en-IN'); }

function isInAppBrowser(){
  const ua = navigator.userAgent || '';
  return /WhatsApp|FBAN|FBAV|Instagram|Line\/|MicroMessenger|Snapchat/i.test(ua);
}

let toastTimer = null;
function showMsg(text){
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  const duration = Math.min(7000, Math.max(2600, text.length * 60));
  toastTimer = setTimeout(()=>{ el.classList.remove('show'); }, duration);
}

let state = {
  view: 'home',       // home | trip
  code: null,
  trip: null,
  step: 'setup',
  isAdmin: false,      // true only via the secret admin link
  pinVerified: false,  // true once the trip PIN has been entered this session
  myParticipantId: null, // which participant this device has claimed, this session
  claimingId: null,    // participant currently showing an inline PIN-claim field
  payingKey: null       // which settle-up row is currently showing the "pay with which app" choices
};

function shareLink(){
  return window.location.origin + window.location.pathname + '#' + state.code;
}
function adminLink(){
  return window.location.origin + window.location.pathname + '#' + state.code + '.' + state.trip.adminToken;
}

async function loadTrip(code){
  try{
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/trips?code=eq.${encodeURIComponent(code)}&select=data`,
      { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } }
    );
    if(!res.ok){
      const t = await res.text().catch(()=>String(res.status));
      showMsg('Load failed (' + res.status + '): ' + t.slice(0,120));
      return null;
    }
    const rows = await res.json();
    return (rows && rows.length) ? rows[0].data : null;
  }catch(e){
    console.error('load failed', e);
    showMsg('Load failed: ' + (e && e.message ? e.message : String(e)));
    return null;
  }
}
async function saveTrip(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/trips`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({ code: state.code, data: state.trip, updated_at: new Date().toISOString() })
    });
    if(!res.ok){
      const errText = await res.text().catch(()=>String(res.status));
      console.error('save error', res.status, errText);
      showMsg('Save failed (' + res.status + '): ' + errText.slice(0,120));
      return false;
    }
    return true;
  }catch(e){
    console.error('save failed', e);
    showMsg('Save failed: ' + (e && e.message ? e.message : String(e)));
    return false;
  }
}

function contourSVG(){
  return `<svg viewBox="0 0 300 18" preserveAspectRatio="none"><path d="M0,9 Q15,2 30,9 T60,9 T90,9 T120,9 T150,9 T180,9 T210,9 T240,9 T270,9 T300,9" fill="none" stroke="#CFCDBC" stroke-width="1"/></svg>`;
}

async function init(){
  if(typeof fetch !== 'function'){
    showMsg("This browser can't reach the database — try a different browser.");
  }
  const raw = window.location.hash.replace('#','').trim();
  if(raw){
    const [codePart, tokenPart] = raw.split('.');
    const code = codePart.toUpperCase();
    const trip = await loadTrip(code);
    if(trip){
      state.code = code;
      state.trip = trip;
      state.pinVerified = true;
      state.view = 'trip';
      if(tokenPart && trip.adminToken && tokenPart === trip.adminToken){
        state.isAdmin = true;
      }
    } else {
      showMsg("That trip link doesn't seem to be valid anymore.");
    }
  }
  render();
}

// Instead of prompt(), claiming opens an inline PIN field next to that person's row.
function startClaim(id){
  state.claimingId = id;
  render();
}
function cancelClaim(){
  state.claimingId = null;
  render();
}
function confirmClaim(id, enteredPin){
  const p = state.trip.participants.find(p=>p.id===id);
  if(!p) return;
  if(enteredPin && enteredPin.trim() === p.pin){
    state.myParticipantId = id;
    state.claimingId = null;
    render();
  }else{
    showMsg('Wrong PIN for ' + p.name + '.');
  }
}

async function newTrip(name){
  const code = genCode();
  const token = genToken();
  state.code = code;
  state.trip = { name: name || 'Untitled trek', adminToken: token, participants: [], expenses: [] };
  state.isAdmin = true;
  state.pinVerified = true;
  state.myParticipantId = null;
  state.view = 'trip';
  window.location.hash = code + '.' + token;
  const ok = await saveTrip();
  if(ok) showMsg('Trip created and saved — copy the link below to share it.');
  render();
}

async function joinTrip(code){
  code = code.trim().toUpperCase();
  if(!code){ showMsg('Type in a trip code first.'); return; }
  const trip = await loadTrip(code);
  if(!trip){ showMsg("Can't find a trip with that code. Check it and try again."); return; }
  state.code = code;
  state.trip = trip;
  state.isAdmin = false;
  state.myParticipantId = null;
  state.pinVerified = true;
  state.view = 'trip';
  window.location.hash = code;
  render();
}

function addParticipant(nm, pin){
  if(!nm.trim()) return;
  if(!pin || !/^\d{4}$/.test(pin.trim())){
    showMsg("Set a 4-digit PIN for this person — it's how they'll claim their name later to edit their own UPI ID.");
    return;
  }
  state.trip.participants.push({ id: Date.now()+''+Math.random(), name: nm.trim(), upi: '', pin: pin.trim() });
  saveTrip(); render();
}
function removeParticipant(id){
  if(!state.isAdmin){ showMsg('Only the trip creator can remove people. Use the admin link.'); return; }
  state.trip.participants = state.trip.participants.filter(p=>p.id!==id);
  if(state.myParticipantId===id) state.myParticipantId = null;
  saveTrip(); render();
}
async function setUpi(id, val){
  if(!(state.isAdmin || state.myParticipantId===id)) return; // not your name to edit
  const p = state.trip.participants.find(p=>p.id===id);
  if(!p) return;
  const cleaned = val.trim();
  if(cleaned && !/^[\w.\-]{2,}@[\w.\-]{2,}$/.test(cleaned)){
    showMsg("That doesn't look like a valid UPI ID (e.g. name@bank).");
    return;
  }
  p.upi = cleaned;
  const ok = await saveTrip();
  if(ok) showMsg('UPI ID saved for ' + p.name + '.');
}
function addExpense(desc, amount, paidBy, splitIds){
  if(!desc.trim() || !amount || !paidBy || splitIds.length===0) return;
  state.trip.expenses.push({
    id: Date.now()+''+Math.random(),
    desc: desc.trim(),
    amount: parseFloat(amount),
    paidBy,
    split: splitIds
  });
  saveTrip(); render();
}
function removeExpense(id){
  if(!state.isAdmin){ showMsg('Only the trip creator can remove expenses. Use the admin link.'); return; }
  state.trip.expenses = state.trip.expenses.filter(e=>e.id!==id);
  saveTrip(); render();
}

function computeBalances(){
  const bal = {};
  state.trip.participants.forEach(p=>bal[p.id]=0);
  state.trip.expenses.forEach(e=>{
    const share = e.amount / e.split.length;
    bal[e.paidBy] = (bal[e.paidBy]||0) + e.amount;
    e.split.forEach(id=>{ bal[id] = (bal[id]||0) - share; });
  });
  // Recorded settlements reduce what's still owed, same as a real payment would.
  (state.trip.settlements||[]).forEach(s=>{
    bal[s.from] = (bal[s.from]||0) + s.amount;
    bal[s.to] = (bal[s.to]||0) - s.amount;
  });
  return bal;
}
function markSettled(from, to, amount){
  const allowed = state.isAdmin || state.myParticipantId===from || state.myParticipantId===to;
  if(!allowed){
    showMsg('Only ' + nameOf(from) + ' or ' + nameOf(to) + ' can mark this as paid — claim your name in Setup first.');
    return;
  }
  if(!state.trip.settlements) state.trip.settlements = [];
  state.trip.settlements.push({ id: Date.now()+''+Math.random(), from, to, amount: fmt(amount) });
  saveTrip(); render();
}
function undoSettled(id){
  if(!state.isAdmin){ showMsg('Only the trip creator can undo a settlement. Use the admin link.'); return; }
  state.trip.settlements = (state.trip.settlements||[]).filter(s=>s.id!==id);
  saveTrip(); render();
}
function settleUp(){
  const bal = computeBalances();
  const creditors = [], debtors = [];
  Object.entries(bal).forEach(([id, amt])=>{
    amt = fmt(amt);
    if(amt > 0.5) creditors.push({id, amt});
    else if(amt < -0.5) debtors.push({id, amt: -amt});
  });
  creditors.sort((a,b)=>b.amt-a.amt);
  debtors.sort((a,b)=>b.amt-a.amt);
  const txns = [];
  let i=0, j=0;
  while(i<debtors.length && j<creditors.length){
    const pay = Math.min(debtors[i].amt, creditors[j].amt);
    txns.push({ from: debtors[i].id, to: creditors[j].id, amount: fmt(pay) });
    debtors[i].amt -= pay;
    creditors[j].amt -= pay;
    if(debtors[i].amt < 0.5) i++;
    if(creditors[j].amt < 0.5) j++;
  }
  return txns;
}
function nameOf(id){
  const p = state.trip.participants.find(p=>p.id===id);
  return p ? p.name : '—';
}
function upiOf(id){
  const p = state.trip.participants.find(p=>p.id===id);
  return p ? p.upi : '';
}
function upiLink(toId, amount){
  const upi = upiOf(toId);
  const nm = encodeURIComponent(nameOf(toId));
  if(upi){
    return `upi://pay?pa=${encodeURIComponent(upi)}&pn=${nm}&am=${amount}&cu=INR`;
  }
  return null;
}
// iOS (and often Android) won't reliably prompt a chooser for a generic upi:// link —
// whichever app last registered the scheme just wins silently. Building each app's own
// scheme means tapping a specific button always opens that specific app, no guessing.
function upiAppLinks(toId, amount){
  const upi = upiOf(toId);
  if(!upi) return null;
  const pa = encodeURIComponent(upi);
  const nm = encodeURIComponent(nameOf(toId));
  const tail = `pa=${pa}&pn=${nm}&am=${amount}&cu=INR`;
  return {
    gpay:    `tez://upi/pay?${tail}`,
    phonepe: `phonepe://pay?${tail}`,
    paytm:   `paytmmp://pay?${tail}`,
    generic: `upi://pay?${tail}`
  };
}

function render(){
  const root = document.getElementById('app');
  if(state.view === 'home'){
    root.innerHTML = `
      <div class="hero">
        <div class="brand-tag">Trailmark</div>
        <h1>Split trek costs without the mess.</h1>
        <p>One link per trip. Log what's spent, see who owes who, pay by UPI.</p>
        <div class="card">
          <label>Start a new trip</label>
          <div class="row" style="margin-top:8px;">
            <input id="tripNameInput" placeholder="e.g. Kudremukh, Nov batch" />
            <button id="createBtn" style="flex:0 0 auto;">Create trip</button>
          </div>
        </div>
        <div class="card">
          <label>Already have a trip code?</label>
          <div class="row" style="margin-top:8px;">
            <input id="codeInput" placeholder="e.g. K7QX2" style="text-transform:uppercase;" />
            <button class="secondary" id="joinBtn" style="flex:0 0 auto;">Join trip</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('createBtn').onclick = ()=>newTrip(document.getElementById('tripNameInput').value);
    document.getElementById('joinBtn').onclick = ()=>joinTrip(document.getElementById('codeInput').value);
    return;
  }

  const t = state.trip;
  const parts = t.participants;

  let body = '';
  if(state.step === 'setup'){
    body = `
      <div class="card">
        <label>Add people on this trek</label>
        <div class="row" style="margin-top:8px;">
          <input id="pName" placeholder="Name" />
          <input id="pPin" placeholder="4-digit PIN" maxlength="4" inputmode="numeric" style="flex:0 0 120px;" />
          <button id="addPBtn" style="flex:0 0 auto;">Add</button>
        </div>
        <div class="muted" style="margin-top:4px;">Each person sets their own PIN — it's how they'll claim their name below to edit their UPI ID.</div>
        <div class="pillrow">
          ${parts.length ? parts.map(p=>`
            <div class="pill">${p.name}${state.isAdmin?`<button data-rm="${p.id}">✕</button>`:''}</div>
          `).join('') : '<span class="muted">No one added yet.</span>'}
        </div>
      </div>
      ${parts.length ? `
      <div class="card">
        <label>UPI IDs — optional, lets people pay with one tap on settle-up</label>
        ${parts.map(p=>{
          const canEdit = state.isAdmin || state.myParticipantId===p.id;
          const claimed = state.myParticipantId===p.id;
          const isClaiming = state.claimingId === p.id;
          return `
          <div class="row" style="margin-bottom:8px;align-items:center;">
            <div style="flex:0 0 100px;display:flex;align-items:center;font-size:13px;">${p.name}${claimed?' <span style="color:var(--moss);">✓</span>':''}</div>
            <input data-upi="${p.id}" placeholder="name@bank" value="${p.upi||''}" ${canEdit?'':'disabled'} />
            ${canEdit ? `<button class="small" data-savupi="${p.id}" style="flex:0 0 auto;">Save</button>` : isClaiming ? `
              <div class="claim-row">
                <input data-claimpin="${p.id}" placeholder="PIN" maxlength="4" inputmode="numeric" />
                <button class="small" data-claimgo="${p.id}" style="flex:0 0 auto;">Go</button>
                <button class="small secondary" data-claimcancel style="flex:0 0 auto;">✕</button>
              </div>
            ` : `<button class="small secondary" data-claimstart="${p.id}" style="flex:0 0 auto;">Claim</button>`}
          </div>
        `}).join('')}
      </div>` : ''}
    `;
  } else if(state.step === 'log'){
    const opts = parts.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
    body = `
      ${parts.length < 2 ? `<div class="empty">Add at least two people in Setup before logging expenses.</div>` : `
      <div class="card">
        <label>Log an expense</label>
        <div class="row" style="margin-top:8px;margin-bottom:8px;">
          <input id="eDesc" placeholder="What was it for" />
          <input id="eAmt" placeholder="Amount" type="number" style="flex:0 0 110px;" />
        </div>
        <label>Paid by</label>
        <select id="ePaidBy" style="margin-bottom:8px;">${opts}</select>
        <label>Split between</label>
        <div class="pillrow" id="splitPills">
          ${parts.map(p=>`<div class="pill" style="background:var(--paper-2);color:var(--ink);" data-split="${p.id}"><input type="checkbox" checked data-cb="${p.id}" style="width:auto;margin:0;"/> ${p.name}</div>`).join('')}
        </div>
        <button id="addEBtn" style="margin-top:8px;">Add expense</button>
      </div>
      `}
      <div class="card">
        <label>All expenses</label>
        ${t.expenses.length===0 ? '<div class="empty">No expenses logged yet.</div>' : t.expenses.slice().reverse().map(e=>`
          <div class="expense-row">
            <div>
              <div class="expense-desc">${e.desc}</div>
              <div class="expense-meta">${nameOf(e.paidBy)} paid · split ${e.split.length} way${e.split.length>1?'s':''}</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="expense-amt">${money(e.amount)}</div>
              ${state.isAdmin?`<button class="small secondary" data-rme="${e.id}">Remove</button>`:''}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  } else if(state.step === 'settle'){
    const txns = settleUp();
    const history = (t.settlements||[]).slice().reverse();
    body = `
      ${isInAppBrowser() ? `
      <div class="inapp-warn">
        You're viewing this inside an app's built-in browser (WhatsApp/Instagram/etc.) — that blocks "Pay" from opening your UPI app. Tap the ⋮ menu (or long-press this page's link) and choose <b>Open in Browser</b> for payments to work.
      </div>` : ''}
      <div class="card">
        <label>Settle up — fewest payments to zero everyone out</label>
        ${txns.length===0 ? `<div class="empty">Everyone's settled. <span class="settled-badge">All square</span></div>` : txns.map(tx=>{
          const key = `${tx.from}|${tx.to}|${tx.amount}`;
          const apps = upiAppLinks(tx.to, tx.amount);
          const isReceiver = state.myParticipantId && state.myParticipantId === tx.to;
          const isPayer = state.myParticipantId && state.myParticipantId === tx.from;
          const canMark = state.isAdmin || isPayer || isReceiver;
          const isPaying = state.payingKey === key;
          let payAction;
          if(isReceiver){
            payAction = `<span class="muted" style="font-size:12px;">Waiting on ${nameOf(tx.from)}</span>`;
          } else if(apps){
            payAction = `<button class="small" data-paystart="${key}">Pay</button>`;
          } else {
            payAction = `<button class="small secondary" disabled title="Add UPI ID in Setup">Pay</button>`;
          }
          const markBtn = canMark
            ? `<button class="small secondary" data-marksettled="${key}">Mark as paid</button>`
            : `<span class="muted" style="font-size:11px;" title="Only ${nameOf(tx.from)} or ${nameOf(tx.to)} can confirm this">🔒</span>`;
          return `
          <div class="settle-item" style="flex-wrap:wrap;">
            <div class="who"><span>${nameOf(tx.from)}${isPayer?' <span class="muted">(you)</span>':''}</span> <span class="path"></span> <span class="to">→ ${nameOf(tx.to)}${isReceiver?' <span class="muted">(you)</span>':''}</span></div>
            <div class="settle-amt">${money(tx.amount)}</div>
            <div style="display:flex;gap:6px;align-items:center;">
              ${payAction}
              ${markBtn}
            </div>
            ${isPaying && apps ? `
            <div style="flex:0 0 100%;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
              <a href="${apps.gpay}"><button class="small secondary">GPay</button></a>
              <a href="${apps.phonepe}"><button class="small secondary">PhonePe</button></a>
              <a href="${apps.paytm}"><button class="small secondary">Paytm</button></a>
              <a href="${apps.generic}"><button class="small secondary">Other UPI app</button></a>
              <button class="small secondary" data-paycancel style="opacity:0.6;">✕</button>
            </div>` : ''}
          </div>
        `}).join('')}
      </div>
      ${history.length ? `
      <div class="card">
        <label>Payment history</label>
        ${history.map(s=>`
          <div class="expense-row">
            <div>
              <div class="expense-desc">${nameOf(s.from)} → ${nameOf(s.to)}</div>
              <div class="expense-meta">marked as paid</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="expense-amt">${money(s.amount)}</div>
              ${state.isAdmin?`<button class="small secondary" data-undosettled="${s.id}">Undo</button>`:''}
            </div>
          </div>
        `).join('')}
      </div>` : ''}
    `;
  }

  root.innerHTML = `
    <div class="brand">
      <div>
        <h1 class="brand-name">${t.name}</h1>
        <div class="brand-tag">Trailmark</div>
        ${state.myParticipantId ? `<div class="whoami">Hi, ${nameOf(state.myParticipantId)} 👋</div>` : state.isAdmin ? `<div class="whoami">Viewing as trip creator</div>` : ''}
      </div>
      <button class="secondary small" id="shareBtn">Copy trip link</button>
    </div>
    <div class="contour">${contourSVG()}</div>
    <div class="code-box">Trip code <b>${state.code}</b> · share the link so others can join</div>
    ${state.isAdmin ? `
    <div class="admin-box">
      You're the trip creator <button id="copyAdminBtn">Copy admin link</button>
      <span class="lock">This link can delete stuff — don't share it with the group.</span>
    </div>` : ''}
    <div class="steps">
      <div class="step ${state.step==='setup'?'active':''}" data-step="setup"><div class="num">1</div><div class="label">Setup</div></div>
      <div class="step ${state.step==='log'?'active':''}" data-step="log"><div class="num">2</div><div class="label">Log</div></div>
      <div class="step ${state.step==='settle'?'active':''}" data-step="settle"><div class="num">3</div><div class="label">Settle up</div></div>
    </div>
    ${body}
  `;

  document.querySelectorAll('.step').forEach(el=>{
    el.onclick = ()=>{ state.step = el.getAttribute('data-step'); render(); };
  });
  document.getElementById('shareBtn').onclick = ()=>{
    navigator.clipboard.writeText(shareLink()).catch(()=>{});
    const btn = document.getElementById('shareBtn');
    btn.textContent = 'Copied';
    setTimeout(()=>{ btn.textContent = 'Copy trip link'; }, 1500);
  };
  if(state.isAdmin){
    const cab = document.getElementById('copyAdminBtn');
    if(cab) cab.onclick = ()=>{
      navigator.clipboard.writeText(adminLink()).catch(()=>{});
      cab.textContent = 'Copied';
      setTimeout(()=>{ cab.textContent = 'Copy admin link'; }, 1500);
    };
  }

  if(state.step==='setup'){
    document.getElementById('addPBtn').onclick = ()=>{
      addParticipant(document.getElementById('pName').value, document.getElementById('pPin').value);
    };
    document.getElementById('pName').addEventListener('keydown', e=>{
      if(e.key==='Enter') addParticipant(e.target.value, document.getElementById('pPin').value);
    });
    document.querySelectorAll('[data-rm]').forEach(el=>{
      el.onclick = ()=>removeParticipant(el.getAttribute('data-rm'));
    });
    document.querySelectorAll('[data-savupi]').forEach(el=>{
      const id = el.getAttribute('data-savupi');
      el.onclick = ()=>{
        const inputEl = document.querySelector(`[data-upi="${id}"]`);
        setUpi(id, inputEl ? inputEl.value : '');
      };
    });
    document.querySelectorAll('[data-upi]').forEach(el=>{
      el.addEventListener('keydown', e=>{
        if(e.key==='Enter') setUpi(el.getAttribute('data-upi'), e.target.value);
      });
    });
    document.querySelectorAll('[data-claimstart]').forEach(el=>{
      el.onclick = ()=>startClaim(el.getAttribute('data-claimstart'));
    });
    document.querySelectorAll('[data-claimcancel]').forEach(el=>{
      el.onclick = ()=>cancelClaim();
    });
    document.querySelectorAll('[data-claimgo]').forEach(el=>{
      const id = el.getAttribute('data-claimgo');
      el.onclick = ()=>{
        const pinEl = document.querySelector(`[data-claimpin="${id}"]`);
        confirmClaim(id, pinEl ? pinEl.value : '');
      };
    });
    document.querySelectorAll('[data-claimpin]').forEach(el=>{
      el.addEventListener('keydown', e=>{
        if(e.key==='Enter') confirmClaim(el.getAttribute('data-claimpin'), e.target.value);
      });
    });
  }
  if(state.step==='log' && parts.length>=2){
    document.getElementById('addEBtn').onclick = ()=>{
      const desc = document.getElementById('eDesc').value;
      const amt = document.getElementById('eAmt').value;
      const paidBy = document.getElementById('ePaidBy').value;
      const splitIds = Array.from(document.querySelectorAll('[data-cb]:checked')).map(cb=>cb.getAttribute('data-cb'));
      addExpense(desc, amt, paidBy, splitIds);
    };
  }
  if(state.step==='log'){
    document.querySelectorAll('[data-rme]').forEach(el=>{
      el.onclick = ()=>removeExpense(el.getAttribute('data-rme'));
    });
  }
  if(state.step==='settle'){
    document.querySelectorAll('[data-marksettled]').forEach(el=>{
      el.onclick = ()=>{
        const [from, to, amount] = el.getAttribute('data-marksettled').split('|');
        markSettled(from, to, parseFloat(amount));
      };
    });
    document.querySelectorAll('[data-undosettled]').forEach(el=>{
      el.onclick = ()=>undoSettled(el.getAttribute('data-undosettled'));
    });
    document.querySelectorAll('[data-paystart]').forEach(el=>{
      el.onclick = ()=>{ state.payingKey = el.getAttribute('data-paystart'); render(); };
    });
    document.querySelectorAll('[data-paycancel]').forEach(el=>{
      el.onclick = ()=>{ state.payingKey = null; render(); };
    });
  }
}

init();
</script>
</body>
</html>
