<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SquareUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16211B;
    --paper:#F1F1EA;
    --paper-2:#E7E6DB;
    --moss:#45614B;
    --moss-soft:#DDE5D9;
    --trail:#C1440E;
    --trail-soft:#F3DCCF;
    --signal:#2F6F71;
    --signal-soft:#DCEBEA;
    --line:#CFCDBC;
    --muted:#6E6C60;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:720px;margin:0 auto;padding:32px 20px 80px;}
  h1,h2{font-family:'Fraunces',serif;margin:0;}
  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
  .brand-name{font-size:26px;font-weight:600;letter-spacing:-0.01em;}
  .app-brand{display:flex;align-items:center;gap:10px;}
  .app-logo{width:52px;height:52px;display:block;flex:0 0 52px;object-fit:contain;}
  .app-brand-name{font-family:'Fraunces',serif;font-size:36px;font-weight:600;letter-spacing:-0.02em;}
  .group-header{position:relative;margin-bottom:28px;padding-right:150px;}
  .group-title{font-family:'Fraunces',serif;font-size:38px;line-height:1.05;font-weight:600;letter-spacing:-0.025em;margin:0 0 10px;}
  .group-brand{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;letter-spacing:0.06em;text-transform:uppercase;}
  .group-brand .app-logo{width:52px;height:52px;flex-basis:52px;object-fit:contain;}
  .group-brand .app-brand-name{font-family:'Fraunces',serif;font-size:31px;font-weight:500;letter-spacing:0.08em;}
  .viewing-as{margin-top:8px;font-family:'Fraunces',serif;font-size:16px;font-weight:500;color:var(--muted);}

  .join-card{max-width:430px;margin:0 auto 16px;}
  .brand-tag{font-size:12px;color:var(--muted);letter-spacing:0.04em;text-transform:uppercase;}
  .contour{position:relative;height:1px;background:var(--line);margin:20px 0 28px;overflow:visible;}
  .contour svg{position:absolute;top:-9px;left:0;width:100%;height:18px;}

  .card{background:#FBFAF6;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
  .muted{color:var(--muted);font-size:13px;}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.03em;}
  input,select{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;
    background:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:16px;color:var(--ink);
  }
  input:focus,select:focus{outline:none;border-color:var(--moss);}
  input:disabled{background:var(--paper-2);color:var(--muted);cursor:not-allowed;}
  .admin-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--trail-soft);color:var(--trail);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;}
  .admin-box button{border-color:var(--trail);color:var(--trail);background:transparent;}
  .lock{color:var(--muted);font-size:12px;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  button{
    font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:14px;
    border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    padding:10px 16px;cursor:pointer;
  }
  button.secondary{background:transparent;color:var(--ink);border-color:var(--line);}
  button.small{padding:6px 10px;font-size:12px;}
  button:active{transform:scale(0.98);}
  .pillrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
  .pill{
    background:var(--moss-soft);color:var(--moss);font-size:13px;font-weight:500;
    padding:6px 12px;border-radius:100px;display:flex;align-items:center;gap:6px;
  }
  .pill button{background:none;border:none;color:var(--moss);padding:0;font-size:13px;line-height:1;cursor:pointer;}

  .steps{display:flex;gap:0;margin-bottom:24px;}
  .step{flex:1;text-align:center;position:relative;padding-bottom:14px;cursor:pointer;}
  .step .num{
    width:26px;height:26px;border-radius:50%;background:var(--paper-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:12px;font-family:'IBM Plex Mono',monospace;
  }
  .step.active .num{background:var(--trail);border-color:var(--trail);color:#fff;}
  .step .label{font-size:12px;color:var(--muted);}
  .step.active .label{color:var(--ink);font-weight:500;}
  .step::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--line);}
  .step.active::after{background:var(--trail);}

  .expense-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .expense-row:last-child{border-bottom:none;}
  .expense-desc{font-weight:500;font-size:14px;}
  .expense-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .expense-amt{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;}

  .settle-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .settle-item:last-child{border-bottom:none;}
  .who{font-size:14px;font-weight:500;flex:1;}
  .who .to{color:var(--trail);}
  .settle-amt{font-family:'IBM Plex Mono',monospace;font-size:15px;min-width:80px;text-align:right;}
  .path{flex:1;height:1px;background:repeating-linear-gradient(to right, var(--line) 0 4px, transparent 4px 8px);position:relative;margin:0 4px;}

  .empty{text-align:center;padding:32px 16px;color:var(--muted);font-size:14px;}
  .empty i{font-size:13px;}

  .code-box{display:flex;align-items:center;gap:10px;background:var(--signal-soft);color:var(--signal);padding:10px 14px;border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;margin-bottom:20px;}
  .code-box b{font-size:15px;letter-spacing:0.05em;}
  .settled-badge{background:var(--signal-soft);color:var(--signal);font-size:12px;padding:4px 10px;border-radius:100px;font-weight:500;}

  .hero{text-align:center;padding:60px 20px;}
  .hero h1{font-size:30px;margin-bottom:10px;}
  .hero p{color:var(--muted);font-size:14px;margin-bottom:28px;line-height:1.6;}
  .hero .card{text-align:left;max-width:360px;margin:0 auto 14px;}
  #toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-20px);
    background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;
    font-size:13px;max-width:90%;text-align:center;z-index:100;
    opacity:0;pointer-events:none;transition:opacity 0.2s ease, transform 0.2s ease;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .claim-row{display:flex;gap:6px;align-items:center;flex:1;}
  .claim-row input{flex:0 0 90px;text-align:center;letter-spacing:3px;}
  .inapp-warn{background:var(--trail-soft);color:var(--trail);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;line-height:1.5;}

.upi-overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center;z-index:9999;padding:16px;}
.upi-sheet{width:min(520px,100%);background:var(--paper,#f5f3ed);border:1px solid var(--line,#d8d4c8);border-radius:22px;padding:20px;box-shadow:0 18px 60px rgba(0,0,0,.25);}
.upi-sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;}
.upi-title{font-family:Georgia,serif;font-size:22px;font-weight:700;}
.upi-subtitle{margin-top:5px;color:var(--muted,#777);font-size:14px;word-break:break-all;}
.upi-close{border:0;background:transparent;font-size:28px;line-height:1;cursor:pointer;padding:0 4px;color:inherit;}
.upi-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.upi-option{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line,#d8d4c8);border-radius:12px;background:transparent;font:inherit;cursor:pointer;text-align:left;}
.upi-app-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#17231d;color:#fff;font-weight:700;}
.upi-copy{width:100%;margin-top:12px;padding:13px;border:1px solid var(--line,#d8d4c8);border-radius:12px;background:transparent;font:inherit;cursor:pointer;}
.upi-note{font-size:12px;color:var(--muted,#777);line-height:1.45;margin-top:10px;}
@media(max-width:520px){.upi-options{grid-template-columns:1fr;}.upi-sheet{padding:18px;}}

</style>
</head>
<body>
<div id="toast"></div>
<div class="app" id="app"></div>

<script>
const SUPABASE_URL = 'https://xmrdrnqavluqkyygqhdc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtcmRybnFhdmx1cWt5eWdxaGRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTc1MTYsImV4cCI6MjEwMTg3MzUxNn0.eJAXu0O78xrfXj0q5OSjao9dAdEgeUwOh2qbeu9xX74';

const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function genCode(){
  let c='';
  for(let i=0;i<5;i++) c += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
  return c;
}
function genToken(){
  let t='';
  for(let i=0;i<12;i++) t += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
  return t;
}
function fmt(n){ return Math.round(n*100)/100; }
function money(n){ return '₹' + fmt(n).toLocaleString('en-IN'); }

function isInAppBrowser(){
  const ua = navigator.userAgent || '';
  return /WhatsApp|FBAN|FBAV|Instagram|Line\/|MicroMessenger|Snapchat/i.test(ua);
}

let toastTimer = null;
function showMsg(text){
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  const duration = Math.min(7000, Math.max(2600, text.length * 60));
  toastTimer = setTimeout(()=>{ el.classList.remove('show'); }, duration);
}

let state = {
  view: 'home',
  code: null,
  trip: null,
  step: 'setup',
  isAdmin: false,
  pinVerified: false,
  myParticipantId: null,
  claimingId: null,
  upiEditId: null
};

function shareLink(){
  return window.location.origin + window.location.pathname + '#' + state.code;
}
function adminLink(){
  return window.location.origin + window.location.pathname + '#' + state.code + '.' + state.trip.adminToken;
}

async function loadGroup(code){
  try{
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/trips?code=eq.${encodeURIComponent(code)}&select=data`,
      { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } }
    );
    if(!res.ok){
      const t = await res.text().catch(()=>String(res.status));
      showMsg('Load failed (' + res.status + '): ' + t.slice(0,120));
      return null;
    }
    const rows = await res.json();
    return (rows && rows.length) ? rows[0].data : null;
  }catch(e){
    console.error('load failed', e);
    showMsg('Load failed: ' + (e && e.message ? e.message : String(e)));
    return null;
  }
}
async function saveGroup(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/trips`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({ code: state.code, data: state.trip, updated_at: new Date().toISOString() })
    });
    if(!res.ok){
      const errText = await res.text().catch(()=>String(res.status));
      console.error('save error', res.status, errText);
      showMsg('Save failed (' + res.status + '): ' + errText.slice(0,120));
      return false;
    }
    return true;
  }catch(e){
    console.error('save failed', e);
    showMsg('Save failed: ' + (e && e.message ? e.message : String(e)));
    return false;
  }
}

function contourSVG(){
  return `<svg viewBox="0 0 300 18" preserveAspectRatio="none"><path d="M0,9 Q15,2 30,9 T60,9 T90,9 T120,9 T150,9 T180,9 T210,9 T240,9 T270,9 T300,9" fill="none" stroke="#CFCDBC" stroke-width="1"/></svg>`;
}

async function init(){
  if(typeof fetch !== 'function'){
    showMsg("This browser can't reach the database — try a different browser.");
  }
  const raw = window.location.hash.replace('#','').trim();
  if(raw){
    const [codePart, tokenPart] = raw.split('.');
    const code = codePart.toUpperCase();
    const trip = await loadGroup(code);
    if(trip){
      state.code = code;
      state.trip = trip;
      if(tokenPart && trip.adminToken && tokenPart === trip.adminToken){
        state.isAdmin = true;
        state.pinVerified = true;
        state.view = 'trip';
      } else if(trip.pin){
        state.view = 'pinGate';
      } else {
        state.pinVerified = true;
        state.view = 'trip';
      }
    } else {
      showMsg("That group link doesn't seem to be valid anymore.");
    }
  }
  render();
}

function verifyPin(pin){
  if(pin && pin.trim() === state.trip.pin){
    state.pinVerified = true;
    state.view = 'trip';
    window.location.hash = state.code;
    render();
  }else{
    showMsg('Wrong PIN. Ask whoever created the group for the correct one.');
  }
}

function startClaim(id){
  state.claimingId = id;
  render();
}
function cancelClaim(){
  state.claimingId = null;
  render();
}
function confirmClaim(id, enteredPin){
  const p = state.trip.participants.find(p=>p.id===id);
  if(!p) return;
  if(enteredPin && enteredPin.trim() === p.pin){
    state.myParticipantId = id;
    state.claimingId = null;
    state.upiEditId = id;
    render();
  }else{
    showMsg('Wrong PIN for ' + p.name + '.');
  }
}

async function newGroup(name, pin){
  if(!pin || !/^\d{4}$/.test(pin.trim())){
    showMsg('Set a 4-digit PIN for the group first.');
    return;
  }
  const code = genCode();
  const token = genToken();
  state.code = code;
  state.trip = {
    name: name || 'Untitled group',
    pin: pin.trim(),
    adminToken: token,
    participants: [],
    expenses: []
  };
  state.isAdmin = true;
  state.pinVerified = true;
  state.myParticipantId = null;
  state.view = 'trip';
  window.location.hash = code + '.' + token;
  const ok = await saveGroup();
  if(ok) showMsg('Group created and saved. Copy the link below to share it.');
  render();
}

async function joinGroup(code){
  code = code.trim().toUpperCase();
  if(!code){
    showMsg('Type in a group code first.');
    return;
  }
  const trip = await loadGroup(code);
  if(!trip){
    showMsg("Can't find a group with that code. Check it and try again.");
    return;
  }
  state.code = code;
  state.trip = trip;
  state.isAdmin = false;
  state.myParticipantId = null;
  state.pinVerified = true;
  state.view = 'joinMember';
  window.location.hash = code;
  render();
}

async function addParticipant(nm, pin, upi='', claimSelf=true){
  nm = (nm || '').trim();
  pin = (pin || '').trim();
  upi = (upi || '').trim();

  if(!nm){
    showMsg('Enter a name first.');
    return false;
  }

  if(!/^\d{4}$/.test(pin)){
    showMsg('Enter your 4-digit PIN.');
    return false;
  }

  // If this person has joined before, let them reclaim their existing
  // participant identity with the PIN they originally created. This avoids
  // creating duplicate names while still preventing someone else from
  // taking the identity or changing its UPI without the correct PIN.
  const existing = state.trip.participants.find(
    p => p.name.trim().toLowerCase() === nm.toLowerCase()
  );

  if(existing){
    if(pin !== String(existing.pin || '').trim()){
      showMsg('That name is already in the group. Enter the PIN you originally created for that name.');
      return false;
    }

    state.myParticipantId = existing.id;

    // The PIN authorizes this person to update their own UPI when rejoining.
    if(upi) existing.upi = upi;

    const ok = await saveGroup();
    if(ok){
      state.claimingId = null;
      state.upiEditId = null;
      state.view = 'trip';
      window.location.hash = state.code;
      showMsg('Welcome back, ' + existing.name + '.');
      render();
    }
    return ok;
  }

  const id = Date.now()+''+Math.random();

  state.trip.participants.push({
    id,
    name:nm,
    upi,
    pin
  });

  if(claimSelf) state.myParticipantId = id;

  const ok = await saveGroup();

  if(ok){
    state.claimingId = null;
    state.view = 'trip';
    window.location.hash = state.code;
    showMsg('You joined the group.');
    render();
  }

  return ok;
}

async function setUpi(id, val){
  if(!(state.isAdmin || state.myParticipantId===id)) return;

  const p = state.trip.participants.find(p=>p.id===id);
  if(!p) return;

  const upi = val.trim();

  if(!upi){
    showMsg('Enter a UPI ID first.');
    return;
  }

  p.upi = upi;

  const ok = await saveGroup();

  if(ok){
    showMsg(`${p.name}'s UPI ID saved.`);
    state.upiEditId = null;
    render();
  }
}

function startUpiEdit(id){
  if(state.isAdmin || state.myParticipantId===id){
    state.upiEditId = id;
    render();
    return;
  }

  state.claimingId = id;
  render();
}

function confirmUpiEdit(id, enteredPin){
  const p = state.trip.participants.find(p=>p.id===id);
  if(!p) return;

  if(enteredPin && enteredPin.trim() === p.pin){
    state.myParticipantId = id;
    state.upiEditId = id;
    state.claimingId = null;
    render();
  }else{
    showMsg('Wrong PIN for ' + p.name + '.');
  }
}

async function joinMember(name, pin, upi){
  return addParticipant(name, pin, upi, true);
}

function addExpense(desc, amount, paidBy, splitIds){
  if(!desc.trim() || !amount || !paidBy || splitIds.length===0) return;

  state.trip.expenses.push({
    id: Date.now()+''+Math.random(),
    desc: desc.trim(),
    amount: parseFloat(amount),
    paidBy,
    split: splitIds
  });

  saveGroup();
  render();
}

function removeExpense(id){
  if(!state.isAdmin){
    showMsg('Only the group creator can remove expenses. Use the group creator link.');
    return;
  }

  state.trip.expenses = state.trip.expenses.filter(e=>e.id!==id);
  saveGroup();
  render();
}

function computeBalances(){
  const bal = {};

  state.trip.participants.forEach(p=>bal[p.id]=0);

  state.trip.expenses.forEach(e=>{
    const share = e.amount / e.split.length;

    bal[e.paidBy] = (bal[e.paidBy]||0) + e.amount;

    e.split.forEach(id=>{
      bal[id] = (bal[id]||0) - share;
    });
  });

  (state.trip.settlements||[]).forEach(s=>{
    bal[s.from] = (bal[s.from]||0) + s.amount;
    bal[s.to] = (bal[s.to]||0) - s.amount;
  });

  return bal;
}

function markSettled(from, to, amount){
  const allowed =
    state.isAdmin ||
    state.myParticipantId===from ||
    state.myParticipantId===to;

  if(!allowed){
    showMsg(
      'Only ' +
      nameOf(from) +
      ' or ' +
      nameOf(to) +
      ' can mark this as paid — claim your name in Setup first.'
    );
    return;
  }

  if(!state.trip.settlements) state.trip.settlements = [];

  state.trip.settlements.push({
    id: Date.now()+''+Math.random(),
    from,
    to,
    amount: fmt(amount)
  });

  saveGroup();
  render();
}

function undoSettled(id){
  if(!state.isAdmin){
    showMsg('Only the group creator can undo a settlement. Use the group creator link.');
    return;
  }

  state.trip.settlements =
    (state.trip.settlements||[]).filter(s=>s.id!==id);

  saveGroup();
  render();
}

function settleUp(){
  const bal = computeBalances();
  const creditors = [];
  const debtors = [];

  Object.entries(bal).forEach(([id, amt])=>{
    amt = fmt(amt);

    if(amt > 0.5)
      creditors.push({id, amt});
    else if(amt < -0.5)
      debtors.push({id, amt: -amt});
  });

  creditors.sort((a,b)=>b.amt-a.amt);
  debtors.sort((a,b)=>b.amt-a.amt);

  const txns = [];
  let i=0, j=0;

  while(i<debtors.length && j<creditors.length){
    const pay = Math.min(
      debtors[i].amt,
      creditors[j].amt
    );

    txns.push({
      from: debtors[i].id,
      to: creditors[j].id,
      amount: fmt(pay)
    });

    debtors[i].amt -= pay;
    creditors[j].amt -= pay;

    if(debtors[i].amt < 0.5) i++;
    if(creditors[j].amt < 0.5) j++;
  }

  return txns;
}

function nameOf(id){
  const p = state.trip.participants.find(p=>p.id===id);
  return p ? p.name : '—';
}

function upiOf(id){
  const p = state.trip.participants.find(p=>p.id===id);
  return p ? p.upi : '';
}

function myName(){
  return state.myParticipantId
    ? nameOf(state.myParticipantId)
    : '';
}

function upiQuery(toId, amount){
  const upi = upiOf(toId);
  const nm = encodeURIComponent(nameOf(toId));
  if(!upi) return null;
  return `pa=${encodeURIComponent(upi)}&pn=${nm}&am=${encodeURIComponent(amount)}&cu=INR`;
}

function upiLink(toId, amount){
  const query = upiQuery(toId, amount);
  return query ? `upi://pay?${query}` : null;
}

function closePaymentChooser(){
  const el = document.getElementById('upiChooser');
  if(el) el.remove();
}

function openUpiApp(scheme, query){
  closePaymentChooser();
  window.location.href = `${scheme}://upi/pay?${query}`;
}

function openPaymentChooser(toId, amount){
  const query = upiQuery(toId, amount);
  if(!query){
    showMsg('This person has not added a UPI ID yet.');
    return;
  }

  closePaymentChooser();
  const upi = upiOf(toId);
  const overlay = document.createElement('div');
  overlay.id = 'upiChooser';
  overlay.className = 'upi-overlay';
  overlay.innerHTML = `
    <div class="upi-sheet" role="dialog" aria-modal="true" aria-label="Choose UPI app">
      <div class="upi-sheet-head">
        <div>
          <div class="upi-title">Pay ${nameOf(toId)}</div>
          <div class="upi-subtitle">${money(amount)} · ${upi}</div>
        </div>
        <button class="upi-close" type="button" aria-label="Close">×</button>
      </div>
      <div class="upi-options">
        <button class="upi-option" data-upiapp="gpay"><span class="upi-app-icon">G</span><span>Google Pay</span></button>
        <button class="upi-option" data-upiapp="phonepe"><span class="upi-app-icon">P</span><span>PhonePe</span></button>
        <button class="upi-option" data-upiapp="paytm"><span class="upi-app-icon">P</span><span>Paytm</span></button>
        <button class="upi-option" data-upiapp="bhim"><span class="upi-app-icon">B</span><span>BHIM</span></button>
        <button class="upi-option" data-upiapp="generic"><span class="upi-app-icon">U</span><span>Other UPI app</span></button>
      </div>
      <button class="upi-copy" type="button">Copy UPI ID</button>
      <div class="upi-note">Choose an app installed on your phone. If it is not installed, use another option or copy the UPI ID.</div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.upi-close').onclick = closePaymentChooser;
  overlay.addEventListener('click', e=>{ if(e.target === overlay) closePaymentChooser(); });
  overlay.querySelectorAll('[data-upiapp]').forEach(btn=>{
    btn.onclick = ()=>{
      const app = btn.dataset.upiapp;
      if(app === 'generic'){
        closePaymentChooser();
        window.location.href = `upi://pay?${query}`;
        return;
      }
      const schemes = {gpay:'gpay', phonepe:'phonepe', paytm:'paytm', bhim:'bhim'};
      openUpiApp(schemes[app], query);
    };
  });
  overlay.querySelector('.upi-copy').onclick = async ()=>{
    try{
      await navigator.clipboard.writeText(upi);
      showMsg('UPI ID copied.');
    }catch(e){
      showMsg('UPI ID: ' + upi);
    }
  };
}

      const amt =
        document.getElementById('eAmt').value;

      const paidBy =
        document.getElementById('ePaidBy').value;

      const splitIds =
        Array.from(
          document.querySelectorAll('[data-cb]:checked')
        ).map(
          cb=>cb.getAttribute('data-cb')
        );

      addExpense(
        desc,
        amt,
        paidBy,
        splitIds
      );
    };
  }

  if(state.step==='log'){
    document.querySelectorAll('[data-rme]').forEach(el=>{
      el.onclick = ()=>{
        removeExpense(
          el.getAttribute('data-rme')
        );
      };
    });
  }

  if(state.step==='settle'){
    document.querySelectorAll('[data-payupi]').forEach(el=>{
    el.onclick = ()=>{
      const parts = el.getAttribute('data-payupi').split('|');
      openPaymentChooser(parts[0], parts[1]);
    };
  });

  document.querySelectorAll('[data-marksettled]').forEach(el=>{
      el.onclick = ()=>{
        const [
          from,
          to,
          amount
        ] = el
          .getAttribute('data-marksettled')
          .split('|');

        markSettled(
          from,
          to,
          parseFloat(amount)
        );
      };
    });

    document.querySelectorAll('[data-undosettled]').forEach(el=>{
      el.onclick = ()=>{
        undoSettled(
          el.getAttribute('data-undosettled')
        );
      };
    });
  }
}

async function removeParticipant(id){
  if(!state.isAdmin){
    showMsg(
      'Only the group creator can remove members.'
    );
    return;
  }

  state.trip.participants =
    state.trip.participants.filter(
      p=>p.id!==id
    );

  state.trip.expenses =
    state.trip.expenses.map(e=>({
      ...e,
      split:e.split.filter(
        pid=>pid!==id
      ),
      paidBy:e.paidBy===id
        ? ''
        : e.paidBy
    })).filter(e=>
      e.paidBy &&
      e.split.length
    );

  if(state.myParticipantId===id){
    state.myParticipantId=null;
  }

  await saveGroup();
  render();
}

function startPolling(){
  setInterval(async ()=>{
    if(!state.code) return;

    const fresh = await loadGroup(
      state.code
    );

    if(!fresh) return;

    const currentMyId =
      state.myParticipantId;

    const currentStep =
      state.step;

    const currentView =
      state.view;

    const currentClaim =
      state.claimingId;

    const currentUpiEdit =
      state.upiEditId;

    state.trip = fresh;

    state.myParticipantId =
      currentMyId &&
      fresh.participants.some(
        p=>p.id===currentMyId
      )
        ? currentMyId
        : null;

    state.step = currentStep;
    state.view = currentView;
    state.claimingId = currentClaim;
    state.upiEditId = currentUpiEdit;

    render();
  },500);
}

startPolling();
init();
</script>
